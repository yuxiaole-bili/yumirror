<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>登录 — yumirror</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--r:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:32px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{font-size:42px;margin-bottom:10px}
h1{font-size:20px;margin-bottom:4px}
.sub{color:var(--muted);font-size:12px;margin-bottom:20px}
input{width:100%;background:#0f1823;border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:12px}
input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px rgba(56,189,248,.15)}
.btn{width:100%;background:var(--accent);color:#0f172a;border:none;padding:11px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.link{margin-top:10px;font-size:12px;color:var(--accent);cursor:pointer;background:none;border:none}
.link:hover{text-decoration:underline}
.err{color:#f87171;font-size:12px;margin-top:10px;min-height:16px}
</style>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="alternate icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
</head>
<body>
<div class="box">
<div class="logo"><svg width="22" height="22" viewBox="0 0 256 256" aria-hidden="true" style="vertical-align:-5px;margin-right:7px"><rect x="8" y="8" width="240" height="240" rx="56" fill="#0f172a" stroke="#38bdf8" stroke-width="10"/><line x1="128" y1="52" x2="128" y2="204" stroke="#22d3ee" stroke-width="12" stroke-linecap="round" stroke-dasharray="26 22"/><rect x="40" y="82" width="70" height="100" rx="14" fill="#162e30" stroke="#34d399" stroke-width="10"/><rect x="146" y="72" width="72" height="110" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="10"/></svg></div>
<h1>yumirror</h1>
<div class="sub" id="sub">账户登录</div>
<input type="text" id="un" placeholder="账户名" onkeydown="if(event.key==='Enter')document.getElementById('pw').focus()">
<input type="password" id="pw" placeholder="密码" onkeydown="if(event.key==='Enter')doSubmit()">
<button class="btn" id="btn" onclick="doSubmit()">登 录</button>
<button class="link" id="toggle" onclick="switchMode()">没有账户？点此注册</button>
<div class="err" id="err"></div>
</div>
<script>
var reg=false;
function post(u,b){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json();});}
function switchMode(){
 reg=!reg;
 document.getElementById('sub').textContent=reg?'注册新账户':'账户登录';
 document.getElementById('btn').textContent=reg?'注 册':'登 录';
 document.getElementById('toggle').textContent=reg?'已有账户？去登录':'没有账户？点此注册';
}
function doSubmit(){
 var un=document.getElementById('un').value.trim();
 var pw=document.getElementById('pw').value;
 var ep=reg?'/api/register':'/api/login';
 post(ep,{username:un,password:pw}).then(function(d){
  if(d.status==='ok'){location.href='/';}
  else{document.getElementById('err').textContent=d.msg||'失败';}
 }).catch(function(){document.getElementById('err').textContent='网络错误';});
}
document.getElementById('un').focus();
</script>
{{ i18n_js() }}
</body>
</html>
