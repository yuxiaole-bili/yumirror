name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 文档与代码是否同步
        run: python scripts/gen_docs.py --check

      - name: 功能冒烟（61 项）
        run: python tests/smoke_test.py

      - name: 安全性攻防（37 项）
        run: python tests/security_test.py

      - name: 模板验收（逐个真跑）
        run: python tests/template_test.py
        timeout-minutes: 25
