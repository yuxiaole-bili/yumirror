name: build

# 打标签时自动构建免安装包并挂到 Release：
#   git tag v3.3.0-alpha2 && git push origin v3.3.0-alpha2
# 也可以在 Actions 页面手动触发，只产出 artifact（不挂 Release）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: 打包 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 构建免安装包（服务端 + 客户端）
        run: python scripts/build_release.py

      - name: 找到产物
        id: find
        shell: bash
        run: |
          f=$(ls dist/yumirror-*.zip dist/yumirror-*.tar.gz 2>/dev/null | head -1)
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "产物: $f ($(du -h "$f" | cut -f1))"

      - name: 上传 artifact（不管是不是发版都能下载）
        uses: actions/upload-artifact@v4
        with:
          name: yumirror-${{ matrix.os }}
          path: ${{ steps.find.outputs.file }}
          if-no-files-found: error

      - name: 挂到 Release（仅打标签时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.find.outputs.file }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
